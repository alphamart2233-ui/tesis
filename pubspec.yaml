name: tesis
description: Aplicación móvil FinTrack EC para gestión financiera personal con análisis predictivo de gastos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  csv: ^5.1.1
  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  path_provider: ^2.1.4
  # Base de datos local
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.24
  emoji_picker_flutter: ^4.3.0
  fl_chart: ^1.1.1
  # Visualización


  # Utilidades
  intl: ^0.19.0
  collection: ^1.18.0
  path: ^1.9.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  connectivity_plus: ^7.0.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  drift_dev: ^2.28.3
  build_runner: ^2.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/
